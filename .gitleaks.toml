title = "nixos repo gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore local ESPHome generated secret artifacts"
paths = [
  '''^esphome/src/secrets\.yaml$''',
  '''^esphome/src/\.esphome/.*$''',
]

[[allowlists]]
description = "Ignore generated Graphify stat-index hash cache"
paths = [
  '''^graphify-out/cache/stat-index\.json$''',
]
