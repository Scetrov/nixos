minimum_pre_commit_version: 3.7.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=2
          - --no-sort-keys
      - id: check-yaml
        exclude: ^esphome/src/esphome\.yml$

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: authentik-group-preservation
        name: Authentik blueprint group ownership
        entry: python3 -m unittest scripts.tests.test_authentik_group_preservation.BlueprintOwnershipTests
        language: system
        pass_filenames: false
        files: ^(src/roles/authentik-config/|scripts/tests/test_authentik_group_preservation\.py$)

      - id: authentik-passkey-configuration
        name: Authentik passkey-first configuration
        entry: python3 -m unittest scripts.tests.test_authentik_passkey_flows scripts.tests.test_authentik_login scripts.tests.test_tofu_fixture
        language: system
        pass_filenames: false
        files: ^(terraform/(authentik(-flows|-settings)?\.tf|variables\.tf)$|src/roles/authentik-config/|scripts/tofu\.sh$|scripts/tests/(test_authentik_(passkey_flows|login)|test_tofu_fixture|run_authentik_passkey_browser)\.py$)

      - id: artcraft-publication
        name: ArtCraft package and publication safety
        entry: python3 -m unittest scripts.tests.test_artcraft scripts.tests.test_artcraft_configuration
        language: system
        pass_filenames: false
        files: ^(config/artcraft\.yml|scripts/artcraft\.py|scripts/tests/test_artcraft(_configuration)?\.py|src/artcraft(-deploy)?\.yml|src/roles/artcraft/|src/roles/nixos/(tasks/branding\.yml|files/etc/nixos/(branding/|modules/(artcraft\.caddy|caddy\.nix|local-networking\.nix)))|terraform/(artcraft|authentik)\.tf|tests/artcraft-eval\.nix|scripts/play\.sh)

      - id: tofu-fmt
        name: tofu fmt
        entry: scripts/tofu.sh -- fmt -write=true
        language: system
        files: \.(tf|tfvars)$
