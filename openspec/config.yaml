schema: spec-driven
context: |
  Living service documentation and enduring contracts are authoritative in docs/.
  Read docs/documentation-workflow.md before proposing, applying or archiving.
  OpenSpec artifacts are temporary active-change plans. Use runbooks and actual
  configuration as the baseline, not permanent capability specs.
rules:
  proposal:
    - Identify the owning docs/ runbook and reference the current system baseline.
  specs:
    - Capture affected desired behaviour and acceptance scenarios temporarily.
    - Reconcile enduring contracts into docs/ instead of a permanent specs tree.
  tasks:
    - Include runbook reconciliation and truthful preservation of verification gaps.
    - Finalize with archive --skip-specs, then prune only the completed archive.
