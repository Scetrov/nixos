# Bootstrap/reconcile admin identity without overwriting application memberships.
# Kept separate so the repair can run without a host rebuild or full tofu apply.
- name: Snapshot existing admin memberships before blueprint reconciliation
  delegate_to: "{{ inventory_hostname }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/api/v3/core/users/?username={{ item | urlencode }}"
    headers:
      Authorization: "Bearer {{ authentik_config_repair_api_token }}"
    status_code: 200
  loop: "{{ [authentik_config_primary_admin_username, 'scetrov'] | unique }}"
  register: authentik_config_admin_memberships_before
  when: authentik_config_repair_api_token | default('') | length > 0
  no_log: true

- name: Reconcile the managed Authentik admin account
  ansible.builtin.include_tasks: deploy-blueprint.yml
  vars:
    authentik_config_blueprint_api_token: "{{ authentik_config_repair_api_token }}"
    authentik_config_blueprint_cookie_header: "{{ authentik_config_repair_cookie_header | default('') }}"
    authentik_config_blueprint_csrf_token: "{{ authentik_config_repair_csrf_token | default('') }}"
    authentik_config_blueprint_name: "{{ authentik_config_primary_admin_blueprint_name }}"
    authentik_config_blueprint_template: "{{ authentik_config_primary_admin_blueprint_template }}"

- name: Read admin memberships after blueprint reconciliation
  delegate_to: "{{ inventory_hostname }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/api/v3/core/users/?username={{ item | urlencode }}"
    headers:
      Authorization: "Bearer {{ authentik_config_repair_api_token }}"
    status_code: 200
  loop: "{{ [authentik_config_primary_admin_username, 'scetrov'] | unique }}"
  register: authentik_config_admin_memberships_after
  when: authentik_config_repair_api_token | default('') | length > 0
  no_log: true

- name: Fail if reconciliation changed existing admin memberships
  ansible.builtin.assert:
    that:
      - item.1.json.results | length == 1
      - >-
        (item.0.json.results[0].groups | sort)
        == (item.1.json.results[0].groups | sort)
    fail_msg: "Admin blueprint changed existing group memberships; stop before applying other configuration."
    quiet: true
  loop: "{{ authentik_config_admin_memberships_before.results | zip(authentik_config_admin_memberships_after.results) | list }}"
  when:
    - authentik_config_repair_api_token | default('') | length > 0
    - item.0.json.results | length > 0
  no_log: true
