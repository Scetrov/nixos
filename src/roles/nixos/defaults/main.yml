# A component-only run must not refresh every channel or restart
# unrelated containers. NixOS still activates the complete declarative host.
nixos_miniflux_only: "{{ ansible_run_tags | length == 1 and 'miniflux' in ansible_run_tags }}"
nixos_immich_only: "{{ ansible_run_tags | length == 1 and 'immich' in ansible_run_tags }}"
nixos_forgejo_only: "{{ ansible_run_tags | length == 1 and 'forgejo' in ansible_run_tags }}"
nixos_filebrowser_only: "{{ ansible_run_tags | length == 1 and 'filebrowser' in ansible_run_tags }}"
nixos_penpot_only: "{{ ansible_run_tags | length == 1 and 'penpot' in ansible_run_tags }}"
