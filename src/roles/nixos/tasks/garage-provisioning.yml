- name: Configure the single-node Garage layout
  become: true
  ansible.builtin.shell: |
    set -euo pipefail

    status="$(garage status)"
    if grep -q 'NO ROLE ASSIGNED' <<<"$status"; then
      node_id="$(awk '/NO ROLE ASSIGNED/ { print $1; exit }' <<<"$status")"
      test -n "$node_id"
      garage layout assign -z habiki -c 250GB "$node_id"
      garage layout apply --version 1
    fi
  args:
    executable: /run/current-system/sw/bin/bash
  when: inventory_hostname == "habiki"
