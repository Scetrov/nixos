- name: Include NixOS pre-flight tasks
  ansible.builtin.include_tasks: preflight.yml

- name: Include Nix Channel tasks
  ansible.builtin.include_tasks: channel.yml
  when: not (nixos_miniflux_only | bool) and not (nixos_immich_only | bool) and not (nixos_forgejo_only | bool)

# sync.yml recursively deploys files/etc/nixos/, so new modules such as
# modules/authentik.nix are copied without adding another include task here.
- name: Include NixOS sync tasks
  ansible.builtin.include_tasks: sync.yml

- name: Copy Authentik branding assets
  tags: [authentik-branding]
  become: true
  ansible.builtin.copy:
    src: "etc/nixos/branding/{{ item }}"
    dest: "/var/lib/authentik/branding/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - logo.png
    - background.jpg
    - hermes-caduceus-84a4bc433bfd.png
    - home-assistant.png
    - forgejo.png
    - miniflux.png
    - immich-a4cda3df8fe5.png
  when: authentik_config_enabled | default(false)

- name: Include NixOS rebuild tasks
  ansible.builtin.include_tasks: rebuild.yml

# - name: Include NixOS garbage collection tasks
#   ansible.builtin.include_tasks: gc.yml

- name: Enroll Habiki in the Headscale tailnet
  ansible.builtin.include_tasks: headscale-enrolment.yml
  when: not (nixos_miniflux_only | bool) and not (nixos_immich_only | bool) and not (nixos_forgejo_only | bool)

- name: Provision Garage storage
  ansible.builtin.include_tasks: garage-provisioning.yml
  when: not (nixos_miniflux_only | bool) and not (nixos_immich_only | bool) and not (nixos_forgejo_only | bool)

- name: Include Podman Restarts
  ansible.builtin.include_tasks: podman.yml
  when: not (nixos_miniflux_only | bool) and not (nixos_immich_only | bool) and not (nixos_forgejo_only | bool)
