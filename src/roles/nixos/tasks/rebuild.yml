- name: Get current git commit hash from the current repo on the local machine
  delegate_to: localhost
  command: git rev-parse HEAD
  args:
    chdir: "{{ playbook_dir }}"
  register: git_hash
  changed_when: false

- name: Get the most recent git commit message
  delegate_to: localhost
  command: git log -1 --pretty=%B
  args:
    chdir: "{{ playbook_dir }}"
  register: git_commit_message
  changed_when: false

- name: Set fact for recent git commit message
  delegate_to: localhost
  set_fact:
    recent_git_commit_message: "{{ git_commit_message.stdout }}"
  run_once: true

- name: Set fact for current git hash
  delegate_to: localhost
  set_fact:
    current_git_hash: "{{ git_hash.stdout }}"
  run_once: true

- name: Generate label
  vars:
    current_date: "{{ ansible_date_time.date }}"
    commit_message: "{{ recent_git_commit_message }}"
    commit_hash: "{{ current_git_hash[:7] }}"
  set_fact:
    nixos_label: "{{ current_date }}-{{ commit_hash }}-{{ commit_message }}"

- name: Sanitize label
  set_fact:
    clean_nixos_label: "{{ nixos_label | regex_replace('\\(\\):\\s', ':') | regex_replace('[^a-zA-Z0-9:_\\.-]', '_') }}"

- debug:
    var: clean_nixos_label

# Stop the already-running old writer before switch can start the new reset unit.
# Reset also refuses to proceed if a writer survived this managed shutdown.
- name: Gather service state before Frontier Indexer transition
  become: true
  ansible.builtin.service_facts:
  when: nixos_device_configuration == 'habiki.nix'

- name: Stop Frontier Indexer writer before NixOS switch
  become: true
  ansible.builtin.systemd_service:
    name: podman-frontier-indexer.service
    state: stopped
  when:
    - nixos_device_configuration == 'habiki.nix'
    - "'podman-frontier-indexer.service' in ansible_facts.services"

- name: Apply NixOS configuration
  become: true
  environment:
    NIXOS_LABEL: "{{ clean_nixos_label }}"
  command: nixos-rebuild switch
  register: nixos_output

# Only reached after a successful switch; never restart an old writer on failure.
- name: Ensure Frontier Indexer starts through the new dependency chain
  become: true
  ansible.builtin.systemd_service:
    name: podman-frontier-indexer.service
    state: started
  when: nixos_device_configuration == 'habiki.nix'

- debug:
    var: nixos_output.stdout_lines
