- name: Validate authoritative Filebrowser runtime credentials
  ansible.builtin.assert:
    that:
      - vars[item] is defined
      - vars[item] is string
      - (vars[item] | default('') | trim) | length > 0
      - (vars[item] | default('') | trim | lower) not in ['null', 'placeholder', 'changeme', 'change-me', 'replace-me']
      - not ((vars[item] | default('') | trim | lower) is match('.*_placeholder$'))
    quiet: true
    fail_msg: "Refresh Filebrowser credentials through scripts/tofu.sh before rendering secrets."
  loop:
    - filebrowser_oidc_client_id
    - filebrowser_oidc_client_secret
    - filebrowser_reconciler_client_id
    - filebrowser_reconciler_app_password
    - filebrowser_reconciler_public_key
  no_log: true

- name: Add Filebrowser credentials to protected agenix rendering
  ansible.builtin.set_fact:
    age_secrets: >-
      {{ age_secrets + [
        {'name': 'filebrowser_oidc_client_id', 'content': filebrowser_oidc_client_id | trim},
        {'name': 'filebrowser_oidc_client_secret', 'content': filebrowser_oidc_client_secret | trim},
        {'name': 'filebrowser_reconciler_client_id', 'content': filebrowser_reconciler_client_id | trim},
        {'name': 'filebrowser_reconciler_app_password', 'content': filebrowser_reconciler_app_password | trim},
        {'name': 'filebrowser_reconciler_public_key', 'content': filebrowser_reconciler_public_key | trim}
      ] }}
  no_log: true
