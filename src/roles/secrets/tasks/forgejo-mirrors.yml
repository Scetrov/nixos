---
# Tokens originate in encrypted src/secrets.yml, never generated placeholders.
- name: Require the dedicated mirror service credential
  ansible.builtin.assert:
    that:
      - forgejo_mirrors_token | default('') | length > 0
      - "'placeholder' not in (forgejo_mirrors_token | default('') | lower)"
    fail_msg: "Mirror discovery requires its dedicated non-admin Forgejo token in the vault."
  no_log: true

- name: Publish the dedicated mirror service credential
  ansible.builtin.set_fact:
    age_secrets: "{{ age_secrets + [{'name': 'forgejo_mirrors_token', 'content': forgejo_mirrors_token}] }}"
  no_log: true

- name: Publish the optional read-only GitHub mirror credential
  ansible.builtin.set_fact:
    age_secrets: "{{ age_secrets + [{'name': 'forgejo_mirrors_github_token', 'content': forgejo_mirrors_github_token}] }}"
  when: forgejo_mirrors_github_token | default('') | length > 0
  no_log: true
