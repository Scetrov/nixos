- name: Create the scoped Garage automation token when Vault has none
  delegate_to: habiki
  become: true
  ansible.builtin.command:
    argv:
      - /run/current-system/sw/bin/bash
      - /run/current-system/sw/bin/garage
      - json-api
      - CreateAdminToken
      - "-"
  args:
    stdin: "{{ garage_admin_token_request | to_json }}"
  vars:
    garage_admin_token_request:
      name: infrastructure-admin
      neverExpires: true
      scope:
        - ListBuckets
        - GetBucketInfo
        - ListKeys
        - GetKeyInfo
        - CreateBucket
        - CreateKey
        - UpdateKey
        - UpdateBucket
        - AllowBucketKey
        - DenyBucketKey
  register: garage_admin_token_create
  changed_when: false
  no_log: true
  when: garage_admin_automation_token | default('') | length == 0

- name: Persist the scoped Garage automation token without printing it
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/garage_broker.py"
      - persist-admin-token
      - --vault
      - "{{ playbook_dir }}/secrets.yml"
      - --password-file
      - "{{ lookup('env', 'HOME') }}/.ansible/nixos_vault_password"
  args:
    stdin: "{{ garage_admin_token_create.stdout }}"
  register: garage_admin_token_persist
  changed_when: garage_admin_token_persist.stdout == 'created'
  no_log: true
  when: garage_admin_automation_token | default('') | length == 0

- name: Use the newly created Garage automation token in this run
  ansible.builtin.set_fact:
    garage_admin_automation_token: "{{ (garage_admin_token_create.stdout | from_json).secretToken }}"
  no_log: true
  when: garage_admin_automation_token | default('') | length == 0
