# Values come only from encrypted src/secrets.yml; never manufacture placeholders.
# The operator-created App material is sbom_bot_github_*; older names remain accepted.
- name: Resolve dedicated SBOM collector credential names
  ansible.builtin.set_fact:
    github_sbom_collector_private_key_resolved: "{{ sbom_bot_github_private_key | default(github_sbom_collector_private_key | default('', true), true) }}"
    dtrack_sbom_collector_token_resolved: "{{ dtrack_sbom_collector_token | default('', true) }}"
  no_log: true

- name: Validate dedicated SBOM collector credentials
  ansible.builtin.assert:
    that:
      - item is string
      - (item | trim) | length > 0
      - not ((item | trim | lower) is match('.*_placeholder$'))
    quiet: true
    fail_msg: "Configure dedicated SBOM collector credentials in the encrypted vault before activation."
  loop:
    - "{{ github_sbom_collector_private_key_resolved }}"
    - "{{ dtrack_sbom_collector_token_resolved }}"
  no_log: true

- name: Require a dedicated GitHub App private key PEM
  vars:
    pem_begin: "-----BEGIN "
    pem_kind: "PRIVATE KEY-----"
  ansible.builtin.assert:
    that:
      - (pem_begin + 'RSA ' + pem_kind) in github_sbom_collector_private_key_resolved or (pem_begin + pem_kind) in github_sbom_collector_private_key_resolved
    quiet: true
    fail_msg: "Store the dedicated SBOM GitHub App private key PEM in the encrypted vault."
  no_log: true

- name: Add dedicated SBOM collector credentials to existing agenix rendering
  ansible.builtin.set_fact:
    age_secrets: "{{ age_secrets + [{'name': 'github_sbom_collector_private_key', 'content': github_sbom_collector_private_key_resolved}, {'name': 'dtrack_sbom_collector_token', 'content': dtrack_sbom_collector_token_resolved}] }}"
  no_log: true
