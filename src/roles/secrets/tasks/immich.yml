- name: Require authoritative Immich credentials and Vault-backed recovery identity
  ansible.builtin.assert:
    that:
      - vars[item] is defined
      - vars[item] is string
      - (vars[item] | default('') | trim) | length > 0
      - (vars[item] | default('') | trim | lower) not in ['null', 'placeholder', 'changeme', 'change-me', 'replace-me']
      - not ((vars[item] | default('') | trim | lower) is match('.*_placeholder$'))
    fail_msg: "Provision Immich recovery credentials in Vault and refresh OIDC outputs through scripts/tofu.sh."
    quiet: true
  loop:
    - immich_oidc_client_id
    - immich_oidc_client_secret
    - immich_admin_email
    - immich_admin_password
  no_log: true

- name: Validate Immich recovery identity strength
  ansible.builtin.assert:
    that:
      - immich_admin_email == 'git@scetrov.live'
      - immich_admin_password | length >= 32
    quiet: true
  no_log: true

- name: Add Immich runtime credentials to the protected agenix workflow
  ansible.builtin.set_fact:
    age_secrets: >-
      {{ age_secrets + [
        {'name': 'immich_oidc_client_id', 'content': immich_oidc_client_id | trim},
        {'name': 'immich_oidc_client_secret', 'content': immich_oidc_client_secret | trim},
        {'name': 'immich_admin_email', 'content': immich_admin_email | trim},
        {'name': 'immich_admin_password', 'content': immich_admin_password}
      ] }}
  no_log: true
