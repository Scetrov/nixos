- name: Require the Vault-backed Miniflux database password
  ansible.builtin.assert:
    that:
      - miniflux_db_password is defined
      - miniflux_db_password is string
      - (miniflux_db_password | default('') | trim) | length >= 32
      - not ((miniflux_db_password | default('') | trim | lower) is match('.*_placeholder$'))
    fail_msg: "Provision miniflux_db_password in src/secrets.yml before deployment."
    quiet: true
  no_log: true

- name: Validate optional subscription enrollment
  ansible.builtin.assert:
    that:
      - miniflux_subscription_api_token is defined
      - miniflux_subscription_api_token is string
      - (miniflux_subscription_api_token | default('')) is match('^[!-~]+$')
      - (miniflux_subscription_api_token | default('') | length) >= 16
      - (miniflux_subscription_api_token | default('') | length) <= 4096
    quiet: true
    fail_msg: "Sign in through OIDC and enroll a personal subscription token in Vault."
  when: miniflux_subscriptions_enabled | default(false) | bool
  no_log: true

- name: Add optional subscription token to protected agenix rendering
  ansible.builtin.set_fact:
    age_secrets: "{{ age_secrets + [{'name': 'miniflux_subscription_api_token', 'content': miniflux_subscription_api_token}] }}"
  when: miniflux_subscriptions_enabled | default(false) | bool
  no_log: true

- name: Add Miniflux runtime credentials to the protected agenix workflow
  ansible.builtin.set_fact:
    age_secrets: >-
      {{ age_secrets + [
        {'name': 'miniflux_db_password', 'content': miniflux_db_password},
        {'name': 'miniflux_database_url', 'content': 'postgres://miniflux:' + (miniflux_db_password | urlencode | replace('/', '%2F')) + '@habiki.net.scetrov.live:5433/miniflux?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt'},
        {'name': 'miniflux_oidc_client_id', 'content': miniflux_oidc_client_id | trim},
        {'name': 'miniflux_oidc_client_secret', 'content': miniflux_oidc_client_secret | trim}
      ] }}
  no_log: true
