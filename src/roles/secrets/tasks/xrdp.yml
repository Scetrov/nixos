- name: Require the existing Vault-backed XRDP CA
  ansible.builtin.assert:
    that:
      - xrdp_ca_cert is defined
      - xrdp_ca_key is defined
      - xrdp_crl_publisher_key is defined
      - "'OPENSSH PRIVATE KEY' in (xrdp_crl_publisher_key | default(''))"
      - "'BEGIN CERTIFICATE' in (xrdp_ca_cert | default(''))"
      - "'PRIVATE KEY' in (xrdp_ca_key | default(''))"
    fail_msg: "Provision xrdp_ca_cert and xrdp_ca_key in src/secrets.yml; never generate a replacement trust anchor during deployment."
    quiet: true
  no_log: true

- name: Add XRDP CA material to the protected agenix workflow
  ansible.builtin.set_fact:
    age_secrets: >-
      {{ age_secrets + [
        {'name': 'xrdp_ca_cert', 'content': xrdp_ca_cert},
        {'name': 'xrdp_ca_key', 'content': xrdp_ca_key},
        {'name': 'xrdp_crl_publisher_key', 'content': xrdp_crl_publisher_key}
      ] }}
  no_log: true
